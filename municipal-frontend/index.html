<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProcureNance</title>

    <!-- Applies the theme before the first paint.
         React can only set the class from an effect, which runs *after* the
         browser has already painted the page in the default theme. That costs a
         visible flash of light on every load for a dark-mode user, and it also
         means the whole tree has to be re-styled a frame later — which the
         browser does not always do reliably for elements that already existed,
         leaving dark text stranded on light cards.
         Reading the cached preference here and setting the class up front means
         the very first paint is already correct and nothing has to be redone.
         The account's stored setting still wins once /auth/me resolves; this is
         only the cache that avoids the flash in between. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
